version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: webapp_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - webapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: webapp_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webapp
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SECRET_KEY: "your-super-secret-key-change-in-production-abc123xyz"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      MAX_FILE_SIZE: "629145600"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - webapp_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: webapp_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - webapp_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  webapp_network:
    driver: bridge
